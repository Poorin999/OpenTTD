name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Slow time 10x
        shell: pwsh
        run: |
          $f = (Get-ChildItem -Path src -Recurse -Filter timer_game_tick.h | Select-Object -First 1).FullName
          if (-not $f) { throw 'timer_game_tick.h not found' }
          $t = Get-Content $f -Raw
          $n = $t -replace '(DAY_TICKS\s*=\s*)74\b', '${1}740'
          if ($n -eq $t) { throw 'DAY_TICKS = 74 not found' }
          Set-Content -Path $f -Value $n -NoNewline

      - name: Add stock mod
        shell: pwsh
        run: |
          $h = @'
          #ifndef STOCK_HISTORY_H
          #define STOCK_HISTORY_H

          #include "company_type.h"
          #include "economy_type.h"
          #include <vector>

          struct Candle {
              Money open = 0, high = 0, low = 0, close = 0;
          };

          struct StockHistory {
              static constexpr size_t MAX_CANDLES = 120;
              std::vector<Candle> candles;
              Candle current;
              bool has_current = false;

              void Reset();
              void OnDay(Money price);
              void OnMonth();
          };

          StockHistory &GetStockHistory(CompanyID company);

          #endif /* STOCK_HISTORY_H */
          '@
          Set-Content -Path src/stock_history.h -Value $h

          $c = @'
          #include "stdafx.h"
          #include "stock_history.h"
          #include "company_base.h"
          #include "company_func.h"
          #include "economy_func.h"
          #include "timer/timer.h"
          #include "timer/timer_game_economy.h"
          #include <utility>

          #include "safeguards.h"

          static std::vector<std::pair<CompanyID, StockHistory>> _stock_histories;

          StockHistory &GetStockHistory(CompanyID company)
          {
              for (auto &entry : _stock_histories) {
                  if (entry.first == company) return entry.second;
              }
              _stock_histories.emplace_back(company, StockHistory{});
              return _stock_histories.back().second;
          }

          void StockHistory::Reset()
          {
              this->candles.clear();
              this->current = {};
              this->has_current = false;
          }

          void StockHistory::OnDay(Money price)
          {
              if (!this->has_current) {
                  this->current = {price, price, price, price};
                  this->has_current = true;
                  return;
              }
              if (price > this->current.high) this->current.high = price;
              if (price < this->current.low) this->current.low = price;
              this->current.close = price;
          }

          void StockHistory::OnMonth()
          {
              if (!this->has_current) return;
              this->candles.push_back(this->current);
              if (this->candles.size() > MAX_CANDLES) this->candles.erase(this->candles.begin());
              Money last = this->current.close;
              this->current = {last, last, last, last};
          }

          static const IntervalTimer<TimerGameEconomy> _stock_daily({TimerGameEconomy::Trigger::Day, TimerGameEconomy::Priority::Company}, [](auto) {
              for (const Company *c : Company::Iterate()) {
                  GetStockHistory(c->index).OnDay(CalculateCompanyValue(c, true));
              }
          });

          static const IntervalTimer<TimerGameEconomy> _stock_monthly({TimerGameEconomy::Trigger::Month, TimerGameEconomy::Priority::Company}, [](auto) {
              for (const Company *c : Company::Iterate()) {
                  GetStockHistory(c->index).OnMonth();
              }
          });
          '@
          Set-Content -Path src/stock_history.cpp -Value $c

          $f = 'src/CMakeLists.txt'
          $t = Get-Content $f -Raw
          $t = $t -replace '(?m)^([ \t]*)station_cmd\.cpp[ \t]*\r?$', "`${1}station_cmd.cpp`n`${1}stock_history.cpp`n`${1}stock_history.h"
          if ($t -notmatch 'stock_history\.cpp') { throw 'Could not patch src/CMakeLists.txt' }
          Set-Content -Path $f -Value $t -NoNewline

      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/Release/openttd.exe out/
          Copy-Item -Recurse build/lang out/lang

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openttd-windows
          path: out
